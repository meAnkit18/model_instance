# Render Blueprint. See docs/deployment.md for the full walkthrough.
# No secrets live in this file (per the brief) -- anything marked
# `sync: false` must be set manually in the Render dashboard, and the
# Colab OAuth token is uploaded as a Secret File, not an env var (it's a
# JSON credential file, not a short string) -- see docs/colab-auth.md.
services:
  - type: web
    name: colab-inference-controller
    runtime: docker
    plan: free              # NOTE: Render's free plan spins the service
                            # down after ~15 min of HTTP inactivity. This
                            # conflicts with the Colab keep-alive daemon
                            # needing to run continuously, and means the
                            # background lifecycle manager (idle-stopping
                            # the Colab GPU) also pauses while Render is
                            # asleep -- a stale GPU session can outlive its
                            # configured WORKER_IDLE_TIMEOUT_SECONDS until
                            # the next request wakes Render back up.
                            # Accepted tradeoff for this deployment; switch
                            # to `starter` (or higher) to close this gap --
                            # see docs/research.md section 4 and
                            # docs/deployment.md.
    autoDeploy: true
    healthCheckPath: /health
    # No persistent disk on the free plan -- COLAB_CONFIG_DIR is therefore
    # ephemeral per deploy/restart. docker-entrypoint.sh re-copies the
    # Colab credential from the (persistent) Secret File on every boot, so
    # auth still works; only the `colab sessions` cache is lost on
    # restart, meaning a still-running Colab GPU can't be rediscovered
    # after a Render restart the way docs/research.md section 4 describes
    # for the disk-backed case.
    envVars:
      - key: WORKER_MODE
        value: colab
      - key: MODEL_ID
        value: Hcompany/Holo1.5-3B
      - key: MODEL_DTYPE
        value: bfloat16
      - key: MAX_MODEL_LEN
        value: "4096"
      - key: MAX_IMAGE_PIXELS
        value: "1003520"
      - key: COLAB_GPU
        value: T4
      - key: COLAB_SESSION_NAME
        value: inference-worker
      - key: COLAB_HOME_DIR
        value: /data
      - key: STATE_FILE
        value: /data/controller_state.json
      - key: WORKER_IDLE_TIMEOUT_SECONDS
        value: "600"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "30"
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "90"
      - key: STARTUP_TIMEOUT_SECONDS
        value: "900"
      - key: INFERENCE_TIMEOUT_SECONDS
        value: "300"
      - key: STARTUP_MAX_RETRIES
        value: "3"
      - key: STARTUP_RETRY_BACKOFF_SECONDS
        value: "20"
      - key: MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: MAX_REQUEST_BODY_BYTES
        value: "10000000"
      - key: API_KEY
        sync: false   # set manually in the dashboard -- a real random secret
      - key: WORKER_REGISTRATION_SECRET
        sync: false   # unused in WORKER_MODE=colab, but set if ever toggled to mock
